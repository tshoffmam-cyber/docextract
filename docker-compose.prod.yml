version: "3.9"

services:
  postgres:
      image: postgres:16-alpine
          restart: always
              environment:
                    POSTGRES_USER: docextract
                          POSTGRES_PASSWORD: docextract
                                POSTGRES_DB: docextract
                                    volumes:
                                          - postgres_data:/var/lib/postgresql/data
                                              healthcheck:
                                                    test: ["CMD-SHELL", "pg_isready -U docextract"]
                                                          interval: 5s
                                                                timeout: 5s
                                                                      retries: 5

                                                                        redis:
                                                                            image: redis:7-alpine
                                                                                restart: always
                                                                                    healthcheck:
                                                                                          test: ["CMD", "redis-cli", "ping"]
                                                                                                interval: 5s
                                                                                                      timeout: 5s
                                                                                                            retries: 5
                                                                                                            
                                                                                                              backend:
                                                                                                                  build: ./backend
                                                                                                                      restart: always
                                                                                                                          command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
                                                                                                                              ports:
                                                                                                                                    - "8000:8000"
                                                                                                                                        env_file: ./backend/.env
                                                                                                                                            environment:
                                                                                                                                                  DATABASE_URL: postgresql+asyncpg://docextract:docextract@postgres:5432/docextract
                                                                                                                                                        REDIS_URL: redis://redis:6379/0
                                                                                                                                                            depends_on:
                                                                                                                                                                  postgres:
                                                                                                                                                                          condition: service_healthy
                                                                                                                                                                                redis:
                                                                                                                                                                                        condition: service_healthy
                                                                                                                                                                                        
                                                                                                                                                                                          worker:
                                                                                                                                                                                              build: ./backend
                                                                                                                                                                                                  restart: always
                                                                                                                                                                                                      command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
                                                                                                                                                                                                          env_file: ./backend/.env
                                                                                                                                                                                                              environment:
                                                                                                                                                                                                                    DATABASE_URL: postgresql+asyncpg://docextract:docextract@postgres:5432/docextract
                                                                                                                                                                                                                          REDIS_URL: redis://redis:6379/0
                                                                                                                                                                                                                              depends_on:
                                                                                                                                                                                                                                    postgres:
                                                                                                                                                                                                                                            condition: service_healthy
                                                                                                                                                                                                                                                  redis:
                                                                                                                                                                                                                                                          condition: service_healthy
                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                          volumes:
                                                                                                                                                                                                                                                            postgres_data:
