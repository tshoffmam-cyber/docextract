name: DocExtract - Integration Test

on:
  workflow_dispatch:

  jobs:
    test-backend:
        runs-on: ubuntu-latest
            timeout-minutes: 15

                services:
                      postgres:
                              image: postgres:16-alpine
                                      env:
                                                POSTGRES_USER: docextract
                                                          POSTGRES_PASSWORD: docextract
                                                                    POSTGRES_DB: docextract
                                                                            ports:
                                                                                      - 5432:5432
                                                                                              options: >-
                                                                                                        --health-cmd pg_isready
                                                                                                                  --health-interval 5s
                                                                                                                            --health-timeout 5s
                                                                                                                                      --health-retries 10
                                                                                                                                      
                                                                                                                                            redis:
                                                                                                                                                    image: redis:7-alpine
                                                                                                                                                            ports:
                                                                                                                                                                      - 6379:6379
                                                                                                                                                                              options: >-
                                                                                                                                                                                        --health-cmd "redis-cli ping"
                                                                                                                                                                                                  --health-interval 5s
                                                                                                                                                                                                            --health-timeout 5s
                                                                                                                                                                                                                      --health-retries 10
                                                                                                                                                                                                                      
                                                                                                                                                                                                                          steps:
                                                                                                                                                                                                                                - name: Checkout code
                                                                                                                                                                                                                                        uses: actions/checkout@v4
                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                              - name: Set up Python 3.12
                                                                                                                                                                                                                                                      uses: actions/setup-python@v5
                                                                                                                                                                                                                                                              with:
                                                                                                                                                                                                                                                                        python-version: "3.12"
                                                                                                                                                                                                                                                                                  cache: "pip"
                                                                                                                                                                                                                                                                                            cache-dependency-path: backend/requirements.txt
                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                  - name: Install dependencies
                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                    pip install --no-cache-dir -r backend/requirements.txt
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                          - name: Create .env for test
                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                            cat > backend/.env << 'EOF'
                                                                                                                                                                                                                                                                                                                                                      DATABASE_URL=postgresql+asyncpg://docextract:docextract@localhost:5432/docextract
                                                                                                                                                                                                                                                                                                                                                                REDIS_URL=redis://localhost:6379/0
                                                                                                                                                                                                                                                                                                                                                                          GEMINI_API_KEY=fake-key-for-test
                                                                                                                                                                                                                                                                                                                                                                                    ANTHROPIC_API_KEY=fake-key-for-test
                                                                                                                                                                                                                                                                                                                                                                                              JWT_SECRET=test-secret-key-for-ci-only
                                                                                                                                                                                                                                                                                                                                                                                                        JWT_EXPIRE_HOURS=24
                                                                                                                                                                                                                                                                                                                                                                                                                  FRONTEND_URL=http://localhost:3000
                                                                                                                                                                                                                                                                                                                                                                                                                            R2_ACCOUNT_ID=fake
                                                                                                                                                                                                                                                                                                                                                                                                                                      R2_ACCESS_KEY_ID=fake
                                                                                                                                                                                                                                                                                                                                                                                                                                                R2_SECRET_ACCESS_KEY=fake
                                                                                                                                                                                                                                                                                                                                                                                                                                                          R2_BUCKET_NAME=docextract-pdfs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    R2_PUBLIC_URL=http://fake.r2.dev
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              MAX_PDF_PAGES=50
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        BATCH_SIZE=15
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  EOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Run Alembic migrations
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                working-directory: backend
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: python -m alembic upgrade head
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          DATABASE_URL: postgresql+asyncpg://docextract:docextract@localhost:5432/docextract
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Start API server (background)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        working-directory: backend
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "Aguardando API iniciar..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              sleep 5
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                DATABASE_URL: postgresql+asyncpg://docextract:docextract@localhost:5432/docextract
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          REDIS_URL: redis://localhost:6379/0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    GEMINI_API_KEY: fake-key-for-test
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ANTHROPIC_API_KEY: fake-key-for-test
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        JWT_SECRET: test-secret-key-for-ci-only
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  JWT_EXPIRE_HOURS: "24"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            FRONTEND_URL: http://localhost:3000
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      R2_ACCOUNT_ID: fake
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                R2_ACCESS_KEY_ID: fake
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          R2_SECRET_ACCESS_KEY: fake
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    R2_BUCKET_NAME: docextract-pdfs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              R2_PUBLIC_URL: http://fake.r2.dev
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        MAX_PDF_PAGES: "50"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  BATCH_SIZE: "15"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Test /health endpoint
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "==> Testando /health..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    curl -v http://localhost:8000/health
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Test /api/v1 docs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "==> Testando /docs..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      curl -s -o /dev/null -w "Status: %{http_code}" http://localhost:8000/docs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: Test auth endpoint exists
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "==> Testando /api/v1/auth/login (espera 422 ou 200, nao 404)..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/api/v1/auth/login \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    -H "Content-Type: application/json" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                -d '{"email":"test@test.com","password":"wrong"}')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "Status: $STATUS"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if [ "$STATUS" = "404" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "ERRO: Endpoint nao encontrado!"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            exit 1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "OK: Endpoint existe (status $STATUS)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Show API info
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "==> Info da API:"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              curl -s http://localhost:8000/ | python3 -m json.tool || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo ""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "==> Rotas disponiveis:"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            curl -s http://localhost:8000/openapi.json | python3 -c "
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      import sys, json
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                data = json.load(sys.stdin)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          paths = list(data.get('paths', {}).keys())
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    for p in sorted(paths):
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  print(p)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            " || true
