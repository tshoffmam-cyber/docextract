name: DocExtract Integration Test
on:
  push:
      branches: [main]
        workflow_dispatch:
        jobs:
          test-backend:
              runs-on: ubuntu-latest
                  timeout-minutes: 15
                      services:
                            postgres:
                                    image: postgres:16-alpine
                                            env:
                                                      POSTGRES_USER: docextract
                                                                POSTGRES_PASSWORD: docextract
                                                                          POSTGRES_DB: docextract
                                                                                  ports:
                                                                                            - 5432:5432
                                                                                                    options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
                                                                                                          redis:
                                                                                                                  image: redis:7-alpine
                                                                                                                          ports:
                                                                                                                                    - 6379:6379
                                                                                                                                            options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
                                                                                                                                                steps:
                                                                                                                                                      - uses: actions/checkout@v4
                                                                                                                                                            - uses: actions/setup-python@v5
                                                                                                                                                                    with:
                                                                                                                                                                              python-version: "3.12"
                                                                                                                                                                                        cache: pip
                                                                                                                                                                                                  cache-dependency-path: backend/requirements.txt
                                                                                                                                                                                                        - name: Install Python deps
                                                                                                                                                                                                                run: pip install --no-cache-dir -r backend/requirements.txt
                                                                                                                                                                                                                      - name: Create .env
                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                        cat > backend/.env << 'ENVEOF'
                                                                                                                                                                                                                                                  DATABASE_URL=postgresql+asyncpg://docextract:docextract@localhost:5432/docextract
                                                                                                                                                                                                                                                            REDIS_URL=redis://localhost:6379/0
                                                                                                                                                                                                                                                                      GEMINI_API_KEY=fake-key-for-test
                                                                                                                                                                                                                                                                                ANTHROPIC_API_KEY=fake-key-for-test
                                                                                                                                                                                                                                                                                          JWT_SECRET=test-secret-key-for-ci-only-32chars
                                                                                                                                                                                                                                                                                                    JWT_EXPIRE_HOURS=24
                                                                                                                                                                                                                                                                                                              FRONTEND_URL=http://localhost:3000
                                                                                                                                                                                                                                                                                                                        R2_ACCOUNT_ID=fake
                                                                                                                                                                                                                                                                                                                                  R2_ACCESS_KEY_ID=fakekey123456789
                                                                                                                                                                                                                                                                                                                                            R2_SECRET_ACCESS_KEY=fakesecret123456789012345678901
                                                                                                                                                                                                                                                                                                                                                      R2_BUCKET_NAME=docextract-pdfs
                                                                                                                                                                                                                                                                                                                                                                R2_PUBLIC_URL=http://fake.r2.dev
                                                                                                                                                                                                                                                                                                                                                                          MAX_PDF_PAGES=50
                                                                                                                                                                                                                                                                                                                                                                                    BATCH_SIZE=15
                                                                                                                                                                                                                                                                                                                                                                                              ENVEOF
                                                                                                                                                                                                                                                                                                                                                                                                    - name: Run migrations
                                                                                                                                                                                                                                                                                                                                                                                                            working-directory: backend
                                                                                                                                                                                                                                                                                                                                                                                                                    env:
                                                                                                                                                                                                                                                                                                                                                                                                                              DATABASE_URL: postgresql+asyncpg://docextract:docextract@localhost:5432/docextract
                                                                                                                                                                                                                                                                                                                                                                                                                                      run: python -m alembic upgrade head
                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: Start API
                                                                                                                                                                                                                                                                                                                                                                                                                                                    working-directory: backend
                                                                                                                                                                                                                                                                                                                                                                                                                                                            env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      DATABASE_URL: postgresql+asyncpg://docextract:docextract@localhost:5432/docextract
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                REDIS_URL: redis://localhost:6379/0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          GEMINI_API_KEY: fake-key-for-test
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ANTHROPIC_API_KEY: fake-key-for-test
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              JWT_SECRET: test-secret-key-for-ci-only-32chars
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        JWT_EXPIRE_HOURS: "24"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  FRONTEND_URL: http://localhost:3000
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            R2_ACCOUNT_ID: fake
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      R2_ACCESS_KEY_ID: fakekey123456789
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                R2_SECRET_ACCESS_KEY: fakesecret123456789012345678901
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          R2_BUCKET_NAME: docextract-pdfs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    R2_PUBLIC_URL: http://fake.r2.dev
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              MAX_PDF_PAGES: "50"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        BATCH_SIZE: "15"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    sleep 8
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Test health
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            curl -sf http://localhost:8000/health && echo "HEALTH OK"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Test auth endpoint
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/api/v1/auth/login -H "Content-Type: application/json" -d '{"email":"t@t.com","password":"x"}')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "Auth status: $STATUS"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        [ "$STATUS" != "404" ] && echo "ENDPOINT OK" || (echo "ENDPOINT NAO ENCONTRADO" && exit 1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: List all routes
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                curl -s http://localhost:8000/openapi.json | python3 -c "import sys,json; [print(p) for p in sorted(json.load(sys.stdin).get('paths',{}).keys())]"
